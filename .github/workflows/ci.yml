name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  issues: read
jobs:
  security:
    name: Security
    uses: ./.github/workflows/security.yml
  result:
    name: CI result
    if: always()
    needs: security
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.security.result }}
        run: test "$RESULT" = success
