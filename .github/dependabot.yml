version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: build(deps)
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    commit-message:
      prefix: build(deps)
    schedule:
      interval: weekly
      day: monday
    groups:
      packages:
        update-types: [minor, patch]
